<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ক্রিস্টাল ওপেন স্কাউটস — ফ্রেম ক্যাম্পেইন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6EC;
    --primary-blue:#0066cc;
    --primary-deep:#004c99;
    --gold:#E0A83D;
    --ink:#241A15;
    --leaf:#4B6B3A;
    --paper-line: rgba(36,26,21,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, var(--paper-line) 1px, transparent 1px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Hind Siliguri','Baloo Da 2',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .btn-back {
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    background:var(--primary-deep);
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
    transition: 0.2s;
  }
  .btn-back:hover { background: var(--primary-blue); }
  .eyebrow{
    letter-spacing:.14em;
    font-size:12px;
    color:var(--primary-deep);
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Baloo Da 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 6vw, 42px);
    text-align:center;
    margin:0 0 6px;
    color:var(--primary-deep);
    line-height:1.15;
  }
  .sub{
    text-align:center;
    max-width:520px;
    color:#5b4c42;
    font-size:15.5px;
    margin:0 0 26px;
  }

  .stage{
    width:min(92vw, 380px);
    aspect-ratio:1/1;
    position:relative;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    box-shadow: 0 2px 0 var(--gold), 0 18px 40px -18px rgba(0,102,204,.4);
    touch-action:none;
    cursor:grab;
  }
  .stage.dragging{cursor:grabbing;}
  .stage canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .empty-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-size:14px;
    color:#a8988c;
    pointer-events:none;
    z-index: 2;
  }

  .panel{
    width:min(92vw, 380px);
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{display:flex; gap:10px;}

  .upload-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 16px;
    background:var(--primary-blue);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:'Hind Siliguri',sans-serif;
    font-weight:600;
    font-size:15.5px;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .upload-btn:hover{background:var(--primary-deep);}
  .upload-btn:active{transform:scale(.97);}

  label.field-label{
    font-size:13px;
    font-weight:600;
    color:#6b5b4f;
    margin-bottom:6px;
    display:block;
  }

  input[type="range"]{
    width:100%;
    accent-color:var(--primary-blue);
  }

  .zoom-row{display:flex; align-items:center; gap:10px;}
  .zoom-row span{font-size:12px; color:#8a7a6d; width:16px;}

  .download-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--leaf);
    color:#fff;
    font-family:'Baloo Da 2',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow: 0 10px 22px -10px rgba(75,107,58,.7);
    transition:transform .12s ease, opacity .15s ease;
  }
  .download-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    box-shadow:none;
  }
  .download-btn:not(:disabled):active{transform:scale(.98);}

  #photoInput{display:none;}

  footer{
    margin-top:34px;
    font-size:12.5px;
    color:#a8988c;
    text-align:center;
  }
</style>
</head>
<body>

  <a href="index.html" class="btn-back">← Back to Dashboard</a>

  <div class="eyebrow">Crystal Open Scouts</div>
  <h1>নিজের ছবি ফ্রেমে বসান</h1>
  <p class="sub">একটি ছবি আপলোড করুন, হাত দিয়ে টেনে ফ্রেমে ঠিকমতো বসান এবং ডাউনলোড করে নিন।</p>

  <div class="stage" id="stage">
    <canvas id="canvas" width="900" height="900"></canvas>
    <div class="empty-hint" id="emptyHint">এখানে আপনার ছবি বসবে —<br>নিচ থেকে একটি ছবি আপলোড করুন</div>
  </div>

  <div class="panel">
    <div class="row">
      <button class="upload-btn" id="uploadBtn">
        📷 ছবি আপলোড করুন
      </button>
    </div>

    <div id="zoomWrap" style="display:none;">
      <label class="field-label">ছবি ছোট-বড় করুন (Zoom)</label>
      <div class="zoom-row">
        <span>−</span>
        <input type="range" id="zoomRange" min="100" max="300" value="100">
        <span>+</span>
      </div>
    </div>

    <button class="download-btn" id="downloadBtn" disabled>ছবি ডাউনলোড করুন</button>
  </div>

  <input type="file" id="photoInput" accept="image/*">

  <footer>টেনে সরান ও স্লাইডার দিয়ে জুম করুন — ছবি কোথাও আপলোড হয় না, আপনার ফোনেই ফ্রেম তৈরি হয়।</footer>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const SIZE = canvas.width; // 900
  const stage = document.getElementById('stage');
  const emptyHint = document.getElementById('emptyHint');
  const photoInput = document.getElementById('photoInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const zoomRange = document.getElementById('zoomRange');
  const zoomWrap = document.getElementById('zoomWrap');

  let userImage = null;
  const frameImage = new Image();
  let isFrameLoaded = false;

  // crystal.png ফাইলটি ডিফল্ট ফ্রেম হিসেবে লোড হচ্ছে
  frameImage.src = 'crystal.png';
  frameImage.onload = () => {
    isFrameLoaded = true;
    render();
  };

  // ছবির ড্র্যাগ ও স্কেলিং স্টেট
  let imgX = SIZE / 2;
  let imgY = SIZE / 2;
  let baseScale = 1;

  let isDragging = false;
  let startX = 0;
  let startY = 0;

  function render() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // ১. হোয়াইট ব্যাকগ্রাউন্ড
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // ২. ইউজারের ছবি (ফ্রেমের নিচে ড্র হবে)
    if (userImage) {
      ctx.save();
      const currentScale = baseScale * (zoomRange.value / 100);
      const w = userImage.width * currentScale;
      const h = userImage.height * currentScale;
      ctx.drawImage(userImage, imgX - w / 2, imgY - h / 2, w, h);
      ctx.restore();
    }

    // ৩. crystal.png ফ্রেম (ছবির উপরে ড্র হবে)
    if (isFrameLoaded) {
      ctx.drawImage(frameImage, 0, 0, SIZE, SIZE);
    }
  }

  // বাটন ক্লিক
  uploadBtn.addEventListener('click', () => photoInput.click());

  // ছবি লোড হ্যান্ডলার
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        userImage = img;
        baseScale = Math.max(SIZE / img.width, SIZE / img.height);
        imgX = SIZE / 2;
        imgY = SIZE / 2;
        zoomRange.value = 100;
        zoomWrap.style.display = 'block';
        emptyHint.style.display = 'none';
        downloadBtn.disabled = false;
        render();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // জুম স্লাইডার
  zoomRange.addEventListener('input', render);

  // ড্র্যাগ ফাংশনালিটি
  function startDrag(e) {
    if (!userImage) return;
    isDragging = true;
    stage.classList.add('dragging');
    const pos = getPos(e);
    startX = pos.x;
    startY = pos.y;
  }

  function doDrag(e) {
    if (!isDragging || !userImage) return;
    const pos = getPos(e);
    const rect = canvas.getBoundingClientRect();
    const scaleFactor = SIZE / rect.width;

    const dx = (pos.x - startX) * scaleFactor;
    const dy = (pos.y - startY) * scaleFactor;

    imgX += dx;
    imgY += dy;

    startX = pos.x;
    startY = pos.y;

    render();
  }

  function stopDrag() {
    isDragging = false;
    stage.classList.remove('dragging');
  }

  function getPos(e) {
    if (e.touches && e.touches.length > 0) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  stage.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', doDrag);
  window.addEventListener('mouseup', stopDrag);

  stage.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('touchmove', doDrag, { passive: false });
  window.addEventListener('touchend', stopDrag);

  // ডাউনলোড হ্যান্ডলার
  downloadBtn.addEventListener('click', () => {
    if (!userImage) return;
    const link = document.createElement('a');
    link.download = 'crystal-scouts-frame.png';
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  });

  render();
})();
</script>

</body>
</html>
